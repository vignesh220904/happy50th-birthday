<!DOCTYPE html>
<html lang="en" data-base="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy 50th Birthday, Amma — M. Buvaneswari</title>
  <meta name="description" content="Celebrating the beautiful journey of M. Buvaneswari: 50 years of love, strength and beautiful memories. 27 October 1976 – 27 October 2026.">
  <meta name="theme-color" content="#d9eeff">
  <meta property="og:title" content="Celebrating the Beautiful Journey of Buvaneswari">
  <meta property="og:description" content="50 Years of Love, Strength & Beautiful Memories.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/media/journey/lj-28-lg.webp">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23ffffff' stroke='%23d9b66f' stroke-width='2'/%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='28' text-anchor='middle' fill='%2317365d'%3E50%3C/text%3E%3C/svg%3E">
  <link rel="modulepreload" href="js/app.js">
  <link rel="preload" href="assets/fonts/cormorant-garamond-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="assets/fonts/manrope.woff2" as="font" type="font/woff2" crossorigin>

  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/deck.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/scenes.css">
</head>
<body>
  <div class="backdrop" aria-hidden="true">
    <div class="backdrop__sky"></div>
    <div class="backdrop__orb backdrop__orb--1"></div>
    <div class="backdrop__orb backdrop__orb--2"></div>
    <div class="backdrop__orb backdrop__orb--3"></div>
    <canvas class="backdrop__particles"></canvas>
  </div>

  <!-- The presentation: one scene per screen. js/core/deck.js moves between them. -->
  <main class="deck" id="deck" aria-roledescription="presentation" aria-label="Happy 50th Birthday, Amma">
    <section class="scene scene--welcome is-active" data-scene="welcome" aria-labelledby="welcome-title">
      <div class="scene__frame welcome">
        <div class="welcome__text">
          <p class="eyebrow welcome__eyebrow" data-welcome="eyebrow">Welcome to the celebration</p>
          <h1 class="welcome__title" id="welcome-title" data-welcome="headline">
            <span class="welcome__line welcome__line--lead">Celebrating the</span>
            <span class="welcome__line">Beautiful Journey</span>
            <span class="welcome__line welcome__line--name">of Buvaneswari</span>
          </h1>
          <p class="welcome__supporting" data-welcome="supporting">50 Years of Love, Strength &amp; Beautiful Memories</p>
          <p class="welcome__dates"><span class="ornament" aria-hidden="true"></span><span data-welcome="dates">27 October 1976 – 27 October 2026</span><span class="ornament" aria-hidden="true"></span></p>
        </div>
        <div class="welcome__visual" aria-hidden="true">
          <div class="welcome__fifty"><span>50</span></div>
          <div class="welcome__photos"></div>
        </div>
      </div>
    </section>
    <section class="scene scene--reveal" data-scene="reveal" aria-labelledby="reveal-title"></section>
    <section class="scene scene--cinema" data-scene="journey-film" aria-labelledby="journey-film-title"></section>
    <section class="scene scene--journey" data-scene="journey" aria-labelledby="journey-title"></section>
    <section class="scene scene--reasons" data-scene="reasons" aria-labelledby="reasons-title"></section>
    <section class="scene scene--cinema" data-scene="memories" aria-labelledby="memories-title"></section>
    <section class="scene scene--gallery" data-scene="gallery" aria-labelledby="gallery-title"></section>
    <section class="scene scene--wishes" data-scene="wishes" aria-labelledby="wishes-title"></section>
    <section class="scene scene--finale" data-scene="finale" aria-labelledby="finale-title"></section>
  </main>

  <div class="deck-ui" data-deck-ui></div>

  <noscript>
    <div class="noscript">
      <h1>Happy 50th Birthday, Amma</h1>
      <p>Celebrating the beautiful journey of M. Buvaneswari. Please enable JavaScript to open the celebration.</p>
    </div>
  </noscript>
  <script>
    // Opened by double-clicking the file? Browsers block the site's data from file:// — explain instead of showing a broken page.
    if (location.protocol === 'file:') {
      document.addEventListener('DOMContentLoaded', function () {
        var box = document.createElement('div');
        box.className = 'file-warning';
        box.setAttribute('role', 'alert');
        box.innerHTML = '<h1>Happy 50th Birthday, Amma</h1>' +
          '<p>This birthday presentation needs to be opened through a small local web server — browsers block it when the file is opened directly.</p>' +
          '<p><strong>Easiest:</strong> close this tab, go back to the project folder and double-click <strong>Open Birthday Site.bat</strong>.</p>' +
          '<p>Or in a terminal inside the folder run <code>npm start</code> and open <code>http://localhost:8080</code>.</p>';
        document.body.appendChild(box);
      });
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
